<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonarr Recovery Agent</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; }
.header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; font-weight: 600; }
.status-bar { display: flex; gap: 16px; font-size: 13px; color: #8b949e; }
.status-bar .ok { color: #3fb950; }
.status-bar .dryrun { color: #d29922; background: #d299221a; padding: 2px 8px; border-radius: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
.stat-card .value { font-size: 28px; font-weight: 700; color: #58a6ff; }
.stat-card .label { font-size: 12px; color: #8b949e; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.section { padding: 0 24px 24px; }
.section h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #21262d; }
th { background: #0d1117; font-weight: 600; color: #8b949e; }
tr:hover { background: #1c2128; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.tag-ok { background: #3fb95022; color: #3fb950; }
.tag-warn { background: #d2992222; color: #d29922; }
.tag-err { background: #f8514922; color: #f85149; }
.tag-pending { background: #58a6ff22; color: #58a6ff; }
.btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; margin: 0 4px; }
.btn-approve { background: #238636; color: #fff; }
.btn-reject { background: #da3633; color: #fff; }
.btn-ignore { background: #30363d; color: #8b949e; }
.btn:hover { opacity: 0.85; }
.breakdown { font-size: 11px; color: #8b949e; }
.breakdown .pass { color: #3fb950; }
.breakdown .fail { color: #f85149; }
.activity-item { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
.activity-item .time { font-size: 12px; color: #8b949e; }
.activity-item .title { font-size: 14px; font-weight: 600; }
.activity-item .reason { font-size: 12px; color: #8b949e; margin-top: 4px; }
.conf-bar { display: flex; gap: 2px; margin: 4px 0; }
.conf-seg { height: 4px; flex: 1; border-radius: 1px; }
.conf-seg.pass { background: #3fb950; }
.conf-seg.fail { background: #30363d; }
</style>
</head>
<body>
<div class="header">
  <h1>Sonarr Recovery Agent</h1>
  <div class="status-bar" id="statusBar">Loading...</div>
</div>
<div class="stats" id="stats">
  <div class="stat-card"><div class="value" id="statRecovered">--</div><div class="label">Recovered Imports</div></div>
  <div class="stat-card"><div class="value" id="statRemoved">--</div><div class="label">Downloads Removed</div></div>
  <div class="stat-card"><div class="value" id="statPending">--</div><div class="label">Pending Review</div></div>
  <div class="stat-card"><div class="value" id="statRetries">--</div><div class="label">Retries</div></div>
</div>
<div class="section">
  <h2>Current Queue</h2>
  <table id="queueTable"><thead><tr><th>Series</th><th>Episode</th><th>Status</th><th>Age</th></tr></thead><tbody></tbody></table>
</div>
<div class="section">
  <h2>Pending Review</h2>
  <div id="suggestions"></div>
</div>
<div class="section">
  <h2>Recent Activity</h2>
  <div id="activity"></div>
</div>

<script>
const API = '/api/v1';

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(resp.statusText);
  return resp.json();
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function confidenceBar(breakdown) {
  if (!breakdown) return '';
  const segs = [
    { pass: breakdown.tvdbMatch, label: 'TVDB' },
    { pass: breakdown.seasonMatch, label: 'S' },
    { pass: breakdown.episodeMatch, label: 'E' },
    { pass: breakdown.qualityKnown, label: 'Q' },
    { pass: breakdown.languageKnown, label: 'L' },
  ];
  let html = '<div class="conf-bar">';
  for (const s of segs) {
    html += '<div class="conf-seg ' + (s.pass ? 'pass' : 'fail') + '" title="' + s.label + ': ' + (s.pass ? 'OK' : 'FAIL') + '"></div>';
  }
  html += '</div>';
  return html;
}

async function refresh() {
  try {
    const status = await fetchJSON(API + '/status');
    let statusHTML = '<span class="ok">Connected</span> | Uptime: ' + status.uptime;
    if (status.dryRun) statusHTML += ' | <span class="dryrun">Dry Run: ON</span>';
    else statusHTML += ' | <span>Live</span>';
    document.getElementById('statusBar').innerHTML = statusHTML;

    const stats = await fetchJSON(API + '/stats');
    document.getElementById('statRecovered').textContent = stats.recoveredImports || 0;
    document.getElementById('statRemoved').textContent = stats.downloadsRemoved || 0;
    document.getElementById('statPending').textContent = stats.pendingReview || 0;
    document.getElementById('statRetries').textContent = stats.retriesPerformed || 0;

    const queue = await fetchJSON(API + '/queue');
    const tbody = document.querySelector('#queueTable tbody');
    tbody.innerHTML = queue.slice(0, 20).map(function(item) {
      let tagClass = 'tag-ok';
      if (item.status === 'warning') tagClass = 'tag-warn';
      if (item.status === 'failed') tagClass = 'tag-err';
      const age = item.added ? (new Date() - new Date(item.added)) : 0;
      return '<tr><td>' + (item.seriesTitle || '?') + '</td><td>' + (item.episodeTitle || '?') + '</td><td><span class="tag ' + tagClass + '">' + item.status + '</span></td><td>' + (age ? formatDuration(age) : '--') + '</td></tr>';
    }).join('');

    const suggestions = await fetchJSON(API + '/suggestions');
    const suggDiv = document.getElementById('suggestions');
    if (!suggestions || suggestions.length === 0) {
      suggDiv.innerHTML = '<p style="color:#8b949e;font-size:13px;">No pending suggestions.</p>';
    } else {
      suggDiv.innerHTML = suggestions.map(function(s) {
        const sn = String(s.seasonNumber).padStart(2, '0');
        return '<div class="activity-item"><div class="title">' + s.seriesTitle + ' S' + sn + 'E' + s.episodeNumbers.join(',') + '</div><div>Confidence: <strong>' + s.confidence + '%</strong></div>' + confidenceBar(s.confidenceBreakdown) + '<div class="breakdown">TVDB: <span class="' + (s.confidenceBreakdown && s.confidenceBreakdown.tvdbMatch ? 'pass' : 'fail') + '">' + (s.confidenceBreakdown && s.confidenceBreakdown.tvdbMatch ? 'OK' : 'FAIL') + '</span> | S: <span class="' + (s.confidenceBreakdown && s.confidenceBreakdown.seasonMatch ? 'pass' : 'fail') + '">' + (s.confidenceBreakdown && s.confidenceBreakdown.seasonMatch ? 'OK' : 'FAIL') + '</span> | E: <span class="' + (s.confidenceBreakdown && s.confidenceBreakdown.episodeMatch ? 'pass' : 'fail') + '">' + (s.confidenceBreakdown && s.confidenceBreakdown.episodeMatch ? 'OK' : 'FAIL') + '</span> | Q: <span class="' + (s.confidenceBreakdown && s.confidenceBreakdown.qualityKnown ? 'pass' : 'fail') + '">' + (s.confidenceBreakdown && s.confidenceBreakdown.qualityKnown ? 'OK' : 'FAIL') + '</span> | L: <span class="' + (s.confidenceBreakdown && s.confidenceBreakdown.languageKnown ? 'pass' : 'fail') + '">' + (s.confidenceBreakdown && s.confidenceBreakdown.languageKnown ? 'OK' : 'FAIL') + '</span></div><div style="margin-top:8px;"><button class="btn btn-approve" onclick="act(\'' + s.id + '\',\'approve\')">Approve</button><button class="btn btn-reject" onclick="act(\'' + s.id + '\',\'reject\')">Reject</button><button class="btn btn-ignore" onclick="act(\'' + s.id + '\',\'ignore\')">Ignore</button></div></div>';
      }).join('');
    }

    const activity = await fetchJSON(API + '/activity?limit=20');
    document.getElementById('activity').innerHTML = activity.map(function(a) {
      return '<div class="activity-item"><div class="time">' + new Date(a.timestamp).toLocaleTimeString() + '</div><div class="title">' + a.item.title + '</div><div class="reason">Trigger: ' + a.trigger + ' | Action: ' + a.action + ' | ' + (a.executed ? (a.dryRun ? 'Would have executed' : 'Executed') : 'Skipped') + '</div></div>';
    }).join('');
  } catch (e) {
    document.getElementById('statusBar').innerHTML = '<span style="color:#f85149">Connection lost</span>';
  }
}

async function act(id, action) {
  await fetch(API + '/suggestions/' + id + '/' + action, { method: 'POST' });
  refresh();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
