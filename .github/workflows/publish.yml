name: Publish Tested Images
on:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: ghcr-sonarr-remediator-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python go
      - name: Verify release, merged PR, successful CI, and exact images
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise exec -- python scripts/release.py verify
          jq -er '"commit=" + .commit' artifacts/release/plan.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.evidence.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Require current Go modules and builder for the tested source
        run: mise exec -- python scripts/dependency-freshness.py release-source
  component:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python
      - name: Install digest-preserving transfer tool on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version
      - name: Revalidate evidence and promote the immutable native image
        env:
          GH_TOKEN: ${{ github.token }}
          SRA_ARCHITECTURE: ${{ matrix.architecture }}
        run: mise exec -- python scripts/release.py component --architecture "$SRA_ARCHITECTURE"
  index:
    needs: [verify, component]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python
      - name: Publish deterministic index, advance stable latest, verify public pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python scripts/release.py index
