name: Publish Tested Images
on:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: ghcr-sonarr-remediator-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: python
      - name: Verify release, merged PR, successful CI, and exact images
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python scripts/release.py verify
  component:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: python
      - name: Install digest-preserving transfer tool on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version
      - name: Revalidate evidence and promote the immutable native image
        env:
          GH_TOKEN: ${{ github.token }}
          SRA_ARCHITECTURE: ${{ matrix.architecture }}
        run: mise exec -- python scripts/release.py component --architecture "$SRA_ARCHITECTURE"
  index:
    needs: [verify, component]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: python
      - name: Publish deterministic index, advance stable latest, verify public pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python scripts/release.py index
