name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          go=false
          docker=false
          ci=false
          case "${{ github.event_name }}" in
            workflow_dispatch|schedule)
              go=true
              docker=true
              ci=true
              ;;
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              for f in $(git diff --name-only "${base}...HEAD"); do
                case "$f" in
                  *.go|go.mod|go.sum|Makefile|.golangci.yml) go=true ;;
                  Dockerfile|.dockerignore) docker=true ;;
                  .github/*) ci=true ;;
                esac
              done
              ;;
            push)
              for f in $(git diff --name-only "${GITHUB_BEFORE}...HEAD"); do
                case "$f" in
                  *.go|go.mod|go.sum|Makefile|.golangci.yml) go=true ;;
                  Dockerfile|.dockerignore) docker=true ;;
                  .github/*) ci=true ;;
                esac
              done
              ;;
          esac
          printf 'go=%s\ndocker=%s\nci=%s\n' "$go" "$docker" "$ci" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never

  vulnerabilities:
    name: Go vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: make vulnerability

  codeql:
    name: CodeQL (Go)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:go

  container:
    name: Container vulnerabilities
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image for scanning
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true'
        run: |
          docker build --platform=linux/amd64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 \
            --build-arg VERSION=security -t sonarr-remediator:security .
      - name: Scan final image
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sonarr-remediator:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
