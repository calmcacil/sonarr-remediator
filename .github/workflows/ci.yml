name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          go=false
          docker=false
          ci=false
          docs=false
          case "${{ github.event_name }}" in
            workflow_dispatch)
              go=true
              docker=true
              ci=true
              docs=true
              ;;
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              for f in $(git diff --name-only "${base}...HEAD"); do
                case "$f" in
                  *.go|go.mod|go.sum|Makefile|.golangci.yml) go=true ;;
                  Dockerfile|.dockerignore) docker=true ;;
                  .github/*) ci=true ;;
                  *.md|scripts/check-doc-links.py) docs=true ;;
                esac
              done
              ;;
            push)
              for f in $(git diff --name-only "${GITHUB_BEFORE}...HEAD"); do
                case "$f" in
                  *.go|go.mod|go.sum|Makefile|.golangci.yml) go=true ;;
                  Dockerfile|.dockerignore) docker=true ;;
                  .github/*) ci=true ;;
                  *.md|scripts/check-doc-links.py) docs=true ;;
                esac
              done
              ;;
          esac
          printf 'go=%s\ndocker=%s\nci=%s\ndocs=%s\n' "$go" "$docker" "$ci" "$docs" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check formatting
        if: needs.changes.outputs.go == 'true'
        run: make format-check
      - name: Check module consistency and vet
        if: needs.changes.outputs.go == 'true'
        run: make module-check
      - name: Run golangci-lint
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Validate workflow syntax
        if: needs.changes.outputs.ci == 'true'
        run: make workflows
      - name: Validate documentation links
        if: needs.changes.outputs.docs == 'true'
        run: make docs
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits, for example 'feat(api): add filter' or 'feat!: breaking change'."
            exit 1
          fi

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Write coverage summary
        shell: bash
        run: |
          {
            echo '## Go coverage'
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  builds:
    name: Supported builds
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build supported Go targets
        run: make build
      - name: Build and smoke-test Linux amd64 image
        run: |
          docker build --platform=linux/amd64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 \
            --build-arg VERSION=ci -t sonarr-remediator:ci-amd64 .
          test "$(docker run --rm sonarr-remediator:ci-amd64 --version)" = ci
      - name: Build Linux arm64 image
        run: |
          docker build --platform=linux/arm64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=arm64 \
            --build-arg VERSION=ci -t sonarr-remediator:ci-arm64 .

  vulnerabilities:
    name: Vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: make vulnerability

  required:
    name: Required
    if: always()
    needs: [changes, quality, tests, builds, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate required checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "One or more required jobs did not succeed: $RESULTS"
              exit 1
            fi
          done
