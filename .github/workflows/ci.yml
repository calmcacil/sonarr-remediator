name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.10.8
          cache_key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}
      - run: mise run check
  podman:
    name: Podman (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.10.8
          install_args: python
      - name: Native rootless build and acceptance
        env:
          SRA_ARCHITECTURE: ${{ matrix.architecture }}
          SRA_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: mise run ci:podman
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/image.oci.tar
            artifacts/metadata.json
            artifacts/runtime.json
          retention-days: 5
          if-no-files-found: error
          compression-level: 0
      - name: Sanitized engine diagnostics on failure
        if: failure()
        run: |
          test ! -f artifacts/podman-info.json || mise exec -- python -c 'import json; p=json.load(open("artifacts/podman-info.json")); print(json.dumps({"version":p["version"], "rootless":p["host"]["security"]["rootless"], "architecture":p["host"]["arch"], "storage_driver":p["store"]["graphDriverName"]}))'
  gate:
    name: CI
    if: always()
    needs: [go, podman]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          GO_RESULT: ${{ needs.go.result }}
          PODMAN_RESULT: ${{ needs.podman.result }}
        run: test "$GO_RESULT" = success && test "$PODMAN_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.10.8
          install_args: python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arm64
      - name: Verify exact images and create promotion receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GO_RESULT: ${{ needs.go.result }}
          PODMAN_RESULT: ${{ needs.podman.result }}
        run: mise exec -- python scripts/oci-evidence.py gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/receipt.json
          retention-days: 5
          if-no-files-found: error
