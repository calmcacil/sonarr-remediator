# Sonarr Recovery Agent Configuration

# ─── Sonarr Connection ───
sonarr:
  url: http://sonarr:8989
  apiKey: "" # required — set via SRA_SONARR__API_KEY
  timeout: 30s
  maxConcurrency: 5

# ─── Monitoring ───
monitoring:
  queueInterval: 30s
  healthInterval: 60s
  startupDelay: 10s

# ─── File System ───
paths:
  downloadRoots: []
  # Legacy (SPEC §3.4): recovery is filesystem-independent; these keys are
  # parsed and validated for compatibility only.
  agentRoot: "" # The root path as seen by the agent (e.g., /data)
  sonarrRoot: "" # The root path as seen by Sonarr (e.g., /data)

# ─── Exclusion ───
exclusions:
  seriesIds: [] # Series IDs to never touch.
  rootPaths: [] # Root folder prefixes to exclude. Any queue item whose
  # download path starts with one of these is skipped.

# ─── Automation ───
automation:

  removeNotCustomFormat:
    enabled: true
    waitHours: 2
    blocklistRelease: false
    statusMessageRegex: ""

  removeBrokenDownloads:
    enabled: true
    waitHours: 6
    blocklistRelease: false
    errorConditions:
      - missing_files
      - abandoned

  # Torrent client error (qBittorrent / torboxarr-style bridges): Sonarr v4
  # reports the qBit error state as warning + "qBittorrent is reporting an
  # error" and never clears the item. The release is removed, blocklisted via
  # POST /api/v3/history/failed/{id} (the queue blocklist parameter no-ops for
  # these clients), and re-searched so a different release is grabbed.
  removeTorrentErrors:
    enabled: true
    waitHours: 1
    errorMessagePattern: "" # default: "(?i)qBittorrent is reporting an error"
    blocklistRelease: true
    redownload: true

  # Unknown-series downloads (seriesId/episodeId null, e.g. torboxarr
  # hash-titled items blocked with "Series title mismatch"): resolve via the
  # manual-import preview first (import with Sonarr's own match), remove only
  # as a fallback when the preview finds nothing.
  resolveUnknownSeries:
    enabled: true
    waitHours: 1

  retryImports:
    enabled: true
    retryIntervals:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
    retryableErrors:
      - "(?i)permission denied"
      - "(?i)access denied"
      - "(?i)no such file"
      - "(?i)connection refused"
      - "(?i)connection timed out"
      - "(?i)no space left"
      - "(?i)input/output error"
      - "(?i)file.*in use"
      - "(?i)destination.*locked"
      - "(?i)mount.*not available"
      - "(?i)path.*not accessible"

  autoManualImport:
    enabled: false
    minimumConfidence: 95

  # Episode reconciliation: map targeted hits (stuck downloads, not a custom
  # format upgrade) by episode, import the highest custom-format-score
  # release as an upgrade, and remove the rest (SPEC §3.2).
  reconcile:
    enabled: true

# ─── Logging ───
logging:
  level: info

# ─── Global ───
dryRun: true
