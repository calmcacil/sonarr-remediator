# Configuration and overrides: docs/CONFIGURATION.md
sonarr:
  url: http://sonarr:8989
  # Use exactly one credential source: api_key_file or api_key.
  api_key_file: /config/sonarr_api_key
  timeout: 10s
# Manual trigger --execute can authorize one live cycle despite this setting.
dry_run: true
poll_interval: 60s
state_path: /state/remediator.db
recovery:
  enabled: true
  wait: 15m
  max_attempts: 3
  retry_interval: 15m
cleanup:
  # Can delete a whole download pack's client data; see docs/POLICY.md.
  enabled: false
  # Permanent episode/folder mismatches and executable-file warnings bypass this wait.
  wait: 6h
  # Both permissions require cleanup.enabled; generic rejected cleanup uses neither.
  blocklist: false
  replacement_search: false
limits:
  mutations_per_scan: 1
  mutations_per_hour: 5
  episode_cooldown: 30m
scope:
  include_series_ids: []
  exclude_series_ids: []
  include_download_clients: []
  exclude_download_clients: []
logging:
  level: info
  format: json
history_retention: 720h
