# Sonarr Recovery Agent Configuration

sonarr:
  url: http://sonarr:8989
  apiKey: ""
  timeout: 30s
  maxConcurrency: 5

monitoring:
  queueInterval: 30s
  historyInterval: 5m
  healthInterval: 60s
  startupDelay: 10s

paths:
  downloadRoots: []
  agentRoot: ""
  sonarrRoot: ""

exclusions:
  seriesIds: []
  rootPaths: []

automation:
  removeNotCustomFormat:
    enabled: true
    waitHours: 2
    blocklistRelease: false
    statusMessageRegex: ""
  removeBrokenDownloads:
    enabled: true
    waitHours: 6
    blocklistRelease: false
    errorConditions:
      - missing_files
      - abandoned
  retryImports:
    enabled: true
    retryIntervals:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
    retryableErrors:
      - "(?i)permission denied"
      - "(?i)access denied"
      - "(?i)no such file"
      - "(?i)connection refused"
      - "(?i)connection timed out"
      - "(?i)no space left"
      - "(?i)input/output error"
      - "(?i)file.*in use"
      - "(?i)destination.*locked"
      - "(?i)mount.*not available"
      - "(?i)path.*not accessible"
  autoManualImport:
    enabled: false
    minimumConfidence: 95
    manualReviewThreshold: 70
  cleanup:
    enabled: false
    interval: 1h
    actions:
      removeEmptyFolders:
        enabled: false
        excludePatterns: ["*.partial", "_unpack*"]
      removeSampleFiles:
        enabled: false
        maxSizeMB: 500
        patterns: ["**/sample*", "**/*-sample.*"]
      removeNFOFiles:
        enabled: false
        maxSizeMB: 10
      removeBrokenSymlinks:
        enabled: false
      removeTempExtraction:
        enabled: false
        ageHours: 24
        patterns: ["**/_unpack/**", "**/.unpack/**", "**/extracted_*/**"]

dashboard:
  enabled: true
  port: 8080
  host: 0.0.0.0
  authToken: ""
  ignoreDuration: 24h

notifications:
  discordWebhook: ""
  slackWebhook: ""
  gotify:
    url: ""
    token: ""
    priority: 5
  ntfy:
    url: ""
    topic: ""
    token: ""
    priority: 3
  webhook:
    url: ""
    method: POST
    headers: {}
    bodyTemplate: ""
  email:
    enabled: false
    smtpHost: ""
    smtpPort: 587
    smtpUsername: ""
    smtpPassword: ""
    from: ""
    to: []
  events:
    import.failed-all-retries: [discord, gotify]
    manual-review.pending: [discord]
    error.sonarr-unreachable: [gotify, ntfy]

logging:
  level: info
  format: json

dryRun: true