services:
  remediator:
    # Pin a released v<VERSION> tag or digest for controlled updates.
    image: ghcr.io/calmcacil/sonarr-remediator:latest
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [run, --config, /config/config.yaml]
    volumes:
      - ./config:/config:ro
      - state:/state
    healthcheck:
      test: [CMD, /sonarr-remediator, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 3m
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  state:
