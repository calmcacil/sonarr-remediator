[tools]
go = "1.27.3"
python = "3.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"aqua:rhysd/actionlint" = "1.7.12"
gh = "2.102.0"

[env]
GOTOOLCHAIN = "local"

[tasks.check]
description = "Check formatting, correctness, OCI evidence, CI syntax, and reachable vulnerabilities"
depends = ["renovate:check"]
run = """
bash scripts/go-checks.sh
actionlint .github/workflows/*.yml
"""

[tasks."ci:test"]
description = "Check CI evidence, release rejection paths, repository policy, and toolchain consistency"
run = "python -m unittest discover -s scripts -p 'test_*.py'"

[tasks."renovate:check"]
description = "Validate dependency automation with the official Renovate validator"
run = "bash scripts/renovate-check.sh"

[tasks."ci:podman"]
description = "Build and exercise the native rootless image (SRA_ARCHITECTURE and SRA_REVISION required)"
run = "bash scripts/podman-ci.sh"

[tasks."repo:inspect"]
description = "Read back repository and Actions policy without changing it"
run = "python scripts/repository-policy.py inspect"

[tasks."repo:plan"]
description = "Show the exact repository and Actions settings to apply"
run = "python scripts/repository-policy.py plan"

[tasks."repo:apply"]
description = "Apply the reviewed repository and Actions policy, then verify it"
run = "python scripts/repository-policy.py apply"

[tasks.test]
description = "Run the Go regression and integration suite with race detection"
run = "go test -race ./..."

[tasks.build]
description = "Build the static application binary"
run = "CGO_ENABLED=0 go build -trimpath -buildvcs=false -o bin/sonarr-remediator ./cmd/sonarr-remediator"
